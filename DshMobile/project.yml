name: DshMobile

options:
  bundleIdPrefix: com.dshmobile
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  DshMobile:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DshMobile
    settings:
      base:
        PRODUCT_NAME: DshMobile
        PRODUCT_BUNDLE_IDENTIFIER: com.dshmobile.app
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "14"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: DSH Mobile
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: DSH Mobile 需要访问本地网络，才能找到并控制你电脑上的 DeepSeek Harness。
        # ATS: the bridge speaks plain HTTP by design, so every host must be
        # allowed — LAN, a Tailscale 100.x / .ts.net address, or a public relay.
        #
        # NSAllowsLocalNetworking MUST stay absent (or false). When it is true
        # alongside NSAllowsArbitraryLoads, iOS treats the pair as "local
        # networking only" and silently blocks every non-local host, which is
        # exactly what breaks a Tailscale peer. ATS exception domains are not a
        # substitute: they ignore ports and cannot enumerate arbitrary hosts.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Expose the app's Documents folder in the Files app as
        # "On My iPhone → DSH Mobile". Bytes written by downloads are then
        # reachable from the system file browser, which is the closest a
        # sandboxed app can get to the system Downloads folder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false

schemes:
  DshMobile:
    build:
      targets:
        DshMobile: all
    run:
      config: Debug
    archive:
      config: Release
